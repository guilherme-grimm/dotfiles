general {
    lock_cmd = pidof hyprlock || hyprlock   # avoid spawning multiple instances
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on # turn screen on after wake
}

# Dim screen after 5 min
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock after 10 min
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn off display after 20 min
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 min
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
